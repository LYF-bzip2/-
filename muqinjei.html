<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>🌷 母亲节快乐</title>
  <style>
    :root {
      --pink-light: #fff0f3;
      --pink: #ffb3c1;
      --pink-deep: #ff6b8a;
      --rose: #e8547c;
      --gold: #f0c27a;
      --text-dark: #5a3745;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: linear-gradient(160deg, #fce4ec 0%, #f8d5de 15%, #fce4ec 30%, #fef0f4 50%, #fce4ec 70%, #f8d5de 85%, #fce4ec 100%);
      background-size: 400% 400%;
      animation: gradientShift 18s ease infinite;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Serif SC', serif;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
      overflow-y: auto;
    }
    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 100%; }
    }

    /* 飘落花瓣 */
    .petals-container {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 0;
    }
    .petal {
      position: absolute; top: -60px;
      animation: fall linear infinite;
      opacity: 0.75;
    }
    @keyframes fall {
      0%   { transform: translateY(0) rotate(0deg) scale(1); opacity: 0.9; }
      100% { transform: translateY(110vh) rotate(500deg) scale(0.3); opacity: 0; }
    }

    /* 主卡片 */
    .card {
      position: relative; z-index: 10;
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 32px;
      padding: 40px 28px 36px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 10px 40px rgba(200,120,140,0.2), inset 0 1px 0 white;
      border: 1px solid rgba(255,180,195,0.5);
      text-align: center;
      animation: float 6s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .flower-top {
      font-size: 52px;
      margin-bottom: 4px;
      filter: drop-shadow(0 4px 10px rgba(255,130,160,0.4));
      letter-spacing: 4px;
    }
    h1 {
      font-size: 2.6em;
      color: var(--rose);
      letter-spacing: 4px;
      margin: 10px 0 6px;
      text-shadow: 0 2px 10px rgba(232,84,124,0.3);
      line-height: 1.3;
    }
    .subtitle {
      color: #c2788a;
      letter-spacing: 2px;
      font-size: 1.1em;
      margin-bottom: 18px;
    }
    .divider {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin: 12px 0 20px;
    }
    .divider-line {
      height: 2px; width: 50px;
      background: linear-gradient(90deg, transparent, #f0c0c8, transparent);
    }

    .blessing {
      font-size: 1.1em;
      line-height: 2.1;
      color: #6b4552;
      letter-spacing: 1.2px;
      margin: 10px 0 20px;
    }
    .blessing .highlight {
      color: var(--rose);
      font-weight: bold;
      font-size: 1.05em;
    }
    .love-btn {
      display: inline-block;
      padding: 14px 40px;
      background: linear-gradient(135deg, #ff8da1, #e8547c);
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 1.2em;
      letter-spacing: 3px;
      font-family: inherit;
      box-shadow: 0 8px 24px rgba(232,84,124,0.35);
      cursor: pointer;
      transition: all 0.3s ease;
      margin: 10px 0 16px;
      -webkit-tap-highlight-color: transparent;
    }
    .love-btn:active {
      transform: scale(0.96);
      background: linear-gradient(135deg, #ff6b8a, #d44a6a);
    }

    .footer-text {
      color: #c0909e;
      font-size: 0.95em;
      letter-spacing: 1px;
      margin-top: 10px;
    }

    /* 点击飞出爱心 */
    .floating-heart {
      position: fixed;
      pointer-events: none;
      z-index: 999;
      font-size: 1.8em;
      animation: heartFly 1.6s ease-out forwards;
    }
    @keyframes heartFly {
      0%   { opacity: 1; transform: translate(0,0) scale(0.5) rotate(0deg); }
      100% { opacity: 0; transform: translate(var(--dx), -200px) scale(1.2) rotate(var(--rot)); }
    }

    @media (max-width: 500px) {
      .card { padding: 32px 20px 28px; }
      h1 { font-size: 2em; }
      .blessing { font-size: 1em; }
    }
  </style>
</head>
<body>
  <div class="petals-container" id="petalsContainer"></div>

  <div class="card">
    <div class="flower-top">🌸🌷💐</div>
    <h1>母亲节快乐</h1>
    <div class="subtitle">✨ Happy Mother's Day ✨</div>
    <div class="divider">
      <span class="divider-line"></span>
      <span>💖</span>
      <span class="divider-line"></span>
    </div>
    <div class="blessing">
      亲爱的 <span class="highlight">妈妈</span>，<br>
      感谢您用<span class="highlight">无私的爱</span>，<br>
      撑起我成长的每一步。<br>
      您的笑容是我心里<span class="highlight">最美的太阳</span>。<br><br>
      愿时光<span class="highlight">温柔</span>，<br>
      愿您<span class="highlight">健康常伴</span>，<br>
      每一天都充满<span class="highlight">幸福与欢笑</span>。<br>
      <span style="font-size:1.2em;">🌷 您辛苦了，我永远爱您 🌷</span>
    </div>
    <button class="love-btn" id="loveBtn">💝 点我送爱心</button>
    <div class="footer-text">
      💐 永远爱您的孩子 💐
    </div>
  </div>

  <script>
    // 生成花瓣
    const petalsContainer = document.getElementById('petalsContainer');
    const emojis = ['🌸','🌷','💮','🌺','🌼','💐','🌻','🏵️','🌹','💗'];
    for (let i = 0; i < 25; i++) {
      let p = document.createElement('span');
      p.className = 'petal';
      p.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      p.style.left = Math.random()*100 + '%';
      p.style.fontSize = (14 + Math.random()*22) + 'px';
      p.style.animationDuration = (8 + Math.random()*12) + 's';
      p.style.animationDelay = Math.random()*10 + 's';
      petalsContainer.appendChild(p);
    }
    setInterval(() => {
      if (petalsContainer.children.length < 30) {
        let p = document.createElement('span');
        p.className = 'petal';
        p.textContent = emojis[Math.floor(Math.random()*emojis.length)];
        p.style.left = Math.random()*100 + '%';
        p.style.fontSize = (14 + Math.random()*22) + 'px';
        p.style.animationDuration = (8 + Math.random()*12) + 's';
        p.style.animationDelay = '0s';
        petalsContainer.appendChild(p);
      }
    }, 4000);

    // 爱心飞出
    const btn = document.getElementById('loveBtn');
    btn.addEventListener('click', function(e) {
      const heart = document.createElement('span');
      heart.className = 'floating-heart';
      heart.textContent = ['💖','💕','💗','💝','❤️','🩷'][Math.floor(Math.random()*6)];
      const x = e.clientX || (btn.getBoundingClientRect().left + btn.offsetWidth/2);
      const y = e.clientY || (btn.getBoundingClientRect().top + btn.offsetHeight/2);
      heart.style.left = x + 'px';
      heart.style.top = y + 'px';
      heart.style.setProperty('--dx', (Math.random()-0.5)*150 + 'px');
      heart.style.setProperty('--rot', (Math.random()-0.5)*200 + 'deg');
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 1700);
    });
  </script>
</body>
</html>
